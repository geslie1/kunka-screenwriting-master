name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/install.py --dest "$RUNNER_TEMP/kunka-skills"
      - run: python scripts/install.py --dest "$RUNNER_TEMP/kunka-skills"
